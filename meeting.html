<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>分區月度會議</title>
  <style>*{box-sizing:border-box}body{margin:0;background:#f5f3f2;color:#2d2929;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",sans-serif}.wrap{max-width:560px;margin:0 auto;padding:28px 18px}.brand{color:#c72832;font-weight:900;letter-spacing:.06em}.card{background:#fff;border:1px solid #e8e2df;border-radius:20px;padding:26px;margin-top:18px;box-shadow:0 12px 34px #4d292d12}h1{font-size:25px;margin:8px 0}p{color:#747071;line-height:1.6}.meeting{display:inline-block;background:#fff0f1;color:#bd2630;border-radius:20px;padding:6px 11px;font-size:13px;font-weight:700}label{display:block;margin-top:18px;font-weight:700;font-size:14px}input,textarea{width:100%;margin-top:7px;border:1px solid #d9d3d1;border-radius:11px;padding:13px;font:inherit;outline:none}input:focus,textarea:focus{border-color:#d35a61;box-shadow:0 0 0 3px #d35a6114}textarea{min-height:110px;resize:vertical}button{width:100%;margin-top:24px;border:0;border-radius:12px;background:#c72832;color:#fff;padding:14px;font-weight:800;font-size:16px}.done{display:none;text-align:center;padding:22px 0}.done b{display:block;font-size:22px;color:#23804a}.note{font-size:12px;color:#999}.meetingChoices{margin-top:20px}.meetingChoices>strong{display:block;font-size:14px}.choice{display:flex;align-items:flex-start;gap:11px;margin-top:10px;border:1px solid #e1d9d6;border-radius:13px;padding:14px;background:#fffafa;cursor:pointer}.choice input{width:20px;height:20px;margin:1px 0 0;accent-color:#c72832;flex:0 0 auto}.choice span{display:block;font-weight:800;line-height:1.45}.choice small{display:block;color:#858081;margin-top:3px;font-weight:500}.choice:has(input:checked){border-color:#c72832;background:#fff1f2;box-shadow:0 0 0 2px #c7283212}</style>
</head>
<body><main class="wrap"><div class="brand">卓越 分區 分區</div><section class="card">
  <div id="formView"><span class="meeting" id="meeting"></span><h1 id="title"></h1><p id="intro"></p><form id="form">
    <div class="meetingChoices" id="meetingChoices"><strong>選擇需要簽到的會議（可同時選兩場）</strong><label class="choice"><input type="checkbox" name="meetingKind" value="summit-admin"><span id="adminMeeting"></span></label><label class="choice"><input type="checkbox" name="meetingKind" value="d0174"><span id="districtMeeting"></span></label></div>
    <label>姓名<input name="name" required autocomplete="name"></label><label>Agent Code<input name="agentCode" required inputmode="numeric" pattern="[0-9]+"></label><label id="reasonBox">請假理由<textarea name="reason" required></textarea></label><button type="submit">確認提交</button><p class="note">資料只用於當月兩場業務會議的行政出勤統計。</p>
  </form></div><div class="done" id="done"><b>✓ 提交成功</b><p id="doneText">資料已送交分區行政工作台，可以關閉此頁。</p></div>
</section></main><script>
const p=new URLSearchParams(location.search),meeting=p.get('meeting')||'',type=p.get('type')==='checkin'?'checkin':'leave',token=p.get('token')||'',monthNo=Number(meeting.slice(5,7))||new Date().getMonth()+1;
const labels={"summit-admin":`卓越行政總區${monthNo}月業務會議`,d0174:`分區${monthNo}月業務交流會`};
document.querySelector('#meeting').textContent=`${meeting} 月度會議`;document.querySelector('#adminMeeting').innerHTML=`${labels['summit-admin']}<small>行政總區會議簽到</small>`;document.querySelector('#districtMeeting').innerHTML=`${labels.d0174}<small>分區業務交流會簽到</small>`;document.querySelector('#title').textContent=type==='leave'?'會議請假登記':'兩場會議簽到';document.querySelector('#intro').textContent=type==='leave'?'請填寫請假資料，請假不改變實際出勤統計。':'請按實際出席情況選擇一場或兩場會議後提交。';if(type==='checkin')document.querySelector('#reasonBox').remove();else document.querySelector('#meetingChoices').remove();
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button'),f=new FormData(e.target),kinds=type==='checkin'?f.getAll('meetingKind'):['d0174'];if(!token){alert('此表連結無效，請重新掃描當月二維碼。');return}if(type==='checkin'&&!kinds.length){alert('請至少選擇一場需要簽到的會議。');return}b.disabled=true;b.textContent='提交中…';try{const results=await Promise.all(kinds.map(meetingKind=>fetch('/api/meeting-response',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({meeting,type,token,meetingKind,name:f.get('name'),agentCode:f.get('agentCode'),reason:f.get('reason')||''})})));if(results.some(r=>!r.ok))throw 0;document.querySelector('#doneText').textContent=type==='checkin'?`已完成 ${kinds.length} 場會議簽到，資料已送交行政工作台。`:'請假資料已送交分區行政工作台。';document.querySelector('#formView').style.display='none';document.querySelector('#done').style.display='block'}catch{b.disabled=false;b.textContent='重新提交';alert('提交失敗；如月份已變更，請重新掃描最新二維碼。')}});
</script></body></html>
